name: CI

# Normal CI pipeline — runs tests and build on every PR.
# Completely separate from the release automation workflow.

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build
