name: Release Automation

# ─────────────────────────────────────────────────────────────────────────────
# This is the ONLY file this repo needs for full release automation.
# All logic lives in YOUR_ORG/release-automation (the hub repo).
#
# Flows handled:
#   Flow 1 — feature/* or defect/* branch created  → JIRA ticket "In Progress"
#   Flow 2 - PR is opened against release. branch  → Validate JIRA ticket
#   Flow 3 — push to release. branch               → JIRA ticket "Ready for Testing"
#   Flow 5 — PR merged to main branch              → JIRA tickets "Accepted"
# ─────────────────────────────────────────────────────────────────────────────

on:
  create:                         # Flow 1 — any branch or tag created

  pull_request:                   # Flow 2 — PR is opened/synchronize against main/release branch
    types:                        # Flow 5 - PR is merged to main from release branch
      - opened          
      - synchronize    
      - closed 
    branches: 
      - 'release.**'
      - 'main'

  push:                           # Flow 3 — release branch pushed/deployed
    branches:
      - 'release.**'

jobs:

  # Flow 1: Branch created → JIRA In Progress 
  on-branch-created:
    name: "Flow 1 — In Progress"
    if: github.event_name == 'create'
    uses: release-automate/release-automation/.github/workflows/branch-automation.yml@main
    with:
      branch_name: ${{ github.ref_name }}
      ref_type:    ${{ github.event.ref_type }}
      repo_name:   ${{ github.repository }}
    secrets: inherit
    
  # Flow 2: Validate JIRA ticket When PR is created
  validate-ticket:
    name: "Flow 2 — Validate JIRA ticket"
    if: >
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' ||
       github.event.action == 'synchronize')
    uses: release-automate/release-automation/.github/workflows/pr-validate.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_title:  ${{ github.event.pull_request.title }}
      pr_body:   ${{ github.event.pull_request.body || '' }}
      repo_name: ${{ github.repository }}
    secrets: inherit

  # ── Flow 3: Release branch deployed → JIRA Ready For Testing ────────────────────────
  on-release-deploy:
    name: "Flow 3 — Ready for Testing"
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/release.')
    uses: release-automate/release-automation/.github/workflows/deploy-automation.yml@main
    with:
      ref:       ${{ github.ref }}
      repo_name: ${{ github.repository }}
    secrets: inherit

  # Flow 5: PR merged to Main Branch from Release Branch → JIRA Accepted 
  on-pr-merged:
    name: "Flow 5 — Accepted"
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    uses: release-automate/release-automation/.github/workflows/pr-automation.yml@main
    with:
      pr_number:   ${{ github.event.pull_request.number }}
      pr_title:    ${{ github.event.pull_request.title }}
      pr_body:     ${{ github.event.pull_request.body || '' }}
      pr_merged:   ${{ github.event.pull_request.merged }}
      base_branch: ${{ github.event.pull_request.base.ref }}
      head_branch: ${{ github.event.pull_request.head.ref }}
      repo_name:   ${{ github.repository }}
    secrets: inherit